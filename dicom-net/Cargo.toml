[package]
name = "dicom-net"
version = "0.1.0"
authors = ["Adel <you@example.com>"]
description = "Production-oriented DIMSE networking layer for DICOM-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dicom", "network", "dimse", "scp", "scu"]
categories = ["network-programming"]

[dependencies]
async-trait = { workspace = true }
dicom-core = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-encoding = { workspace = true }
dicom-object = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
dicom-ul = { workspace = true, features = ["async"] }
snafu = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dicom-core = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-object = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
dicom-ul = { workspace = true, features = ["async"] }
tempfile = "3.10"
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["async"]
async = []
tls = ["dicom-ul/async-tls"]

[package.metadata.docs.rs]
all-features = true
