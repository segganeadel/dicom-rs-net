[package]
name = "dicom-net"
version = "0.1.0"
authors = ["Adel <you@example.com>"]
description = "Production-oriented DIMSE networking layer for DICOM-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dicom", "network", "dimse", "scp", "scu"]
categories = ["network-programming"]

[dependencies]
async-trait = { workspace = true }
dicom-core = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-encoding = { workspace = true }
dicom-object = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
dicom-ul = { workspace = true, features = ["async"] }
snafu = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
walkdir = { workspace = true }
bytes = "1"
socket2 = "0.5"
dicom-pixeldata = { workspace = true, optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["logging", "tls12", "std", "ring"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["logging", "tls12"] }

[dev-dependencies]
dicom-core = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-object = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
dicom-ul = { workspace = true, features = ["async"] }
tempfile = "3.10"
tokio = { workspace = true, features = ["test-util"] }
rustls-cert-gen = "0.2"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["logging", "tls12", "std", "ring"] }
[features]
default = ["async", "transcode"]
async = []
transcode = ["dep:dicom-pixeldata"]
tls = ["dicom-ul/async-tls", "dep:rustls", "dep:tokio-rustls"]

[package.metadata.docs.rs]
all-features = true
